services:
  db:
    image: postgres:15
    container_name: social-db
    restart: always
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        test "$${#POSTGRES_PASSWORD}" -ge 32 || { echo "POSTGRES_PASSWORD must contain at least 32 characters" >&2; exit 1; };
        exec docker-entrypoint.sh postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:latest
    container_name: social-redis
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        test "$${#REDIS_PASSWORD}" -ge 32 || { echo "REDIS_PASSWORD must contain at least 32 characters" >&2; exit 1; };
        exec redis-server --requirepass "$${REDIS_PASSWORD}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    ports:
      - '127.0.0.1:6380:6379'
    volumes:
      - redis-db:/data
    restart: always
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: social-app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '8000:8000'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/node_modules/.prisma
    working_dir: /app
    # Build DATABASE_URL inside the container so passwords with reserved URL
    # characters (for example @, :, /, or #) are encoded correctly.
    command:
      - /bin/sh
      - -ec
      - |
        export DATABASE_URL="postgresql://$${DB_USER}:$$(node -p 'encodeURIComponent(process.env.DB_PASS)')@$${DB_HOST}:$${DB_PORT}/$${DB_NAME}?schema=public"
        npx prisma migrate deploy
        exec npm run start:prod
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASS: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}

volumes:
  postgres-data:
  redis-db:
